# Veritas Platform Infrastructure as Code
# Multi-Service Render Blueprint Specification
# Deploys:
#   1. veritas-ai-engine (Python FastAPI Uvicorn Web Service)
#   2. veritas-backend (Java 21 Spring Boot 3 Docker Web Service)
#   3. veritas-frontend (React 19 Vite Static Site with Global CDN)

services:
  # ============================================================================
  # 1. Veritas AI & Similarity Forensics Engine
  # ============================================================================
  - type: web
    name: veritas-ai-engine
    runtime: python
    plan: free
    region: singapore
    rootDir: ai-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ============================================================================
  # 2. Veritas Academic Ledger & Classroom Backend
  # ============================================================================
  - type: web
    name: veritas-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/studio/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: VERITAS_AI_ENGINE_URL
        fromService:
          type: web
          name: veritas-ai-engine
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: veritas-db
          property: connectionString

  # ============================================================================
  # 3. Veritas Client Presentation Shell (React 19 + Vite)
  # ============================================================================
  - type: web
    name: veritas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_AI_ENGINE_URL
        fromService:
          type: web
          name: veritas-ai-engine
          property: host
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: veritas-backend
          property: host

databases:
  # ============================================================================
  # 4. Veritas PostgreSQL 18 Relational & Graph Database
  # ============================================================================
  - name: veritas-db
    databaseName: veritasdb
    user: veritas
    region: singapore
    plan: free

