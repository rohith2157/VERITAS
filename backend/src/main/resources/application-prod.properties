# Production Profile Configuration for Veritas Enterprise Backend
spring.application.name=veritas-backend-prod
server.port=${PORT:10000}

# Enforce PostgreSQL Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Liveness and Readiness Probes
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# AI Engine Microservice Integration
veritas.ai-engine.url=${VERITAS_AI_ENGINE_URL:http://localhost:8000}

# RFC 7807 Problem Detail Specification for REST APIs
spring.mvc.problemdetails.enabled=true
