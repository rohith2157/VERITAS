spring.application.name=veritas-backend
server.port=8080

# Default to PostgreSQL (Port 2157, veritasdb) with H2 fallback capability
spring.datasource.url=jdbc:postgresql://localhost:2157/veritasdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=8333035340
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# AI Engine Microservice Integration
veritas.ai-engine.url=http://localhost:8000

# RFC 7807 Problem Detail Specification for REST APIs
spring.mvc.problemdetails.enabled=true
