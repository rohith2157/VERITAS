spring.application.name=veritas-backend
server.port=8080

# Intelligent Dual-Mode Database Engine:
# DataSourceConfig automatically detects if PostgreSQL is active on port 2157.
# If PostgreSQL is not active, it gracefully falls back to embedded H2 database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console when running in H2 fallback mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Engine Microservice Integration
veritas.ai-engine.url=http://localhost:8000

# RFC 7807 Problem Detail Specification for REST APIs
spring.mvc.problemdetails.enabled=true
